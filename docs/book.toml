[book]
title = "The Dune Programming Language"
authors = ["ComradeMashkov"]
description = "Language reference, standard-library reference, and guides for the Dune programming language."
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ComradeMashkov/dune"
edit-url-template = "https://github.com/ComradeMashkov/dune/edit/main/docs/{path}"
no-section-label = false
# A modern restyle (indigo accent, refined typography, rounded code blocks).
additional-css = ["custom.css"]
# Registers a Dune grammar with highlight.js so ```dune / ```dn fences highlight.
additional-js = ["dune-highlight.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
