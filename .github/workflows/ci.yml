name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Required gate: the bytecode VM is the only backend, so its tests (plus the
  # shared front end) must pass on every platform. macOS uses the preinstalled
  # Apple clang instead of `brew install llvm`. Linting runs with
  # `-D DUNE_ENABLE_LINT=OFF` on every platform: clang-tidy over the whole tree
  # is sequential and made the Linux leg ~5x slower than the others, so format
  # and tidy are left to the default local build instead of gating CI.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Install tools on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install tools on Windows
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          choco install ninja -y
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja -D CMAKE_CXX_COMPILER=clang++ -D DUNE_ENABLE_LINT=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test (VM / core)
        run: ctest --test-dir build --output-on-failure
